version: '3.8'

services:
  api-monitor:
    build: .
    container_name: api-log-monitor
    volumes:
      # Mount docker socket to access host docker
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount reports and state for persistence
      - ./reports:/app/reports
      - ./state:/app/state
      - ./feedback:/app/feedback
      - ./logs:/app/logs
      # Mount the parent docker-compose file
      - ../../docker-compose.dev.yml:/docker-compose.dev.yml:ro
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
      - COMPOSE_FILE=/docker-compose.dev.yml
    network_mode: host
    restart: unless-stopped
    command: python3 main_agent.py